name: Backtest Heist PR DeepSeek-V4-Flash pilot v4

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BACKTEST_HEIST_ISSUE_NUMBER: '16'
      BACKTEST_HEIST_RESULT_BRANCH: backtest-heist-results-20260804-v4
      BACKTEST_HEIST_REAL_DATA_PATH: '/tmp/backtest-heist-data/all_stocks_5yr.csv'
      PINNED_DATA_COMMIT: '03917ece161e269098fb0e84a9aac8956683bc7b'
    steps:
      - uses: actions/checkout@v4

      - name: Import reviewed v4 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin backtest-heist-runtime-v4
          RUNTIME_COMMIT="$(git rev-parse FETCH_HEAD)"
          echo "RUNTIME_COMMIT=$RUNTIME_COMMIT" >> "$GITHUB_ENV"
          rm -rf backtest_heist_runtime
          mkdir -p backtest_heist_runtime/runner_parts backtest_heist_runtime/bootstrap_parts
          git show "$RUNTIME_COMMIT":backtest_heist_runtime/bootstrap_parts/part00 > backtest_heist_runtime/bootstrap_parts/part00
          for p in 00 01 02 03 04 05 06; do
            git show "$RUNTIME_COMMIT":backtest_heist_runtime/runner_parts/part${p} > backtest_heist_runtime/runner_parts/part${p}
          done

      - name: Assemble commit-pinned S&P 500 panel
        shell: bash
        run: |
          set -Eeuo pipefail
          DATA_DIR=/tmp/backtest-heist-data
          mkdir -p "$DATA_DIR/files"
          BASE="https://raw.githubusercontent.com/saeed349/Deep-Reinforcement-Learning-in-Trading/${PINNED_DATA_COMMIT}/Data"
          for ticker in AAPL MSFT AMZN GOOGL ORCL ADBE IBM INTC CSCO JPM BAC GS MS XOM CVX COP SLB CAT BA MMM JNJ PFE PG KO WMT HD VZ T; do
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 90 \
              --user-agent 'backtest-heist-research-pilot/1.0' \
              "$BASE/${ticker}_data.csv" -o "$DATA_DIR/files/${ticker}_data.csv" || \
              rm -f "$DATA_DIR/files/${ticker}_data.csv"
          done
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          root = Path('/tmp/backtest-heist-data')
          fields = ['date','open','high','low','close','volume','Name']
          rows, files, failures = [], {}, {}
          for ticker in ['AAPL','MSFT','AMZN','GOOGL','ORCL','ADBE','IBM','INTC','CSCO','JPM','BAC','GS','MS','XOM','CVX','COP','SLB','CAT','BA','MMM','JNJ','PFE','PG','KO','WMT','HD','VZ','T']:
              p = root / 'files' / f'{ticker}_data.csv'
              try:
                  raw = p.read_bytes()
                  with p.open(encoding='utf-8-sig', newline='') as f:
                      reader = csv.DictReader(f)
                      if reader.fieldnames != fields:
                          raise ValueError(f'columns={reader.fieldnames}')
                      part = list(reader)
                  if len(part) < 1000 or not part or part[0]['Name'].upper() != ticker:
                      raise ValueError(f'rows={len(part)}')
                  rows.extend(part)
                  dates = [r['date'] for r in part]
                  files[ticker] = {'sha256': hashlib.sha256(raw).hexdigest(), 'rows': len(part), 'date_min': min(dates), 'date_max': max(dates)}
              except Exception as exc:
                  failures[ticker] = f'{type(exc).__name__}: {exc}'
          if len(files) < 20:
              raise RuntimeError(f'Only {len(files)} symbols loaded; failures={failures}')
          rows.sort(key=lambda r: (r['Name'], r['date']))
          out = root / 'all_stocks_5yr.csv'
          with out.open('w', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              writer.writeheader(); writer.writerows(rows)
          dates = [r['date'] for r in rows]
          meta = {
              'source_repository': 'saeed349/Deep-Reinforcement-Learning-in-Trading',
              'source_commit': os.environ['PINNED_DATA_COMMIT'],
              'upstream_dataset': 'camnugent/sandp500',
              'upstream_version': 4,
              'upstream_license': 'CC0-1.0',
              'combined_sha256': hashlib.sha256(out.read_bytes()).hexdigest(),
              'rows': len(rows), 'tickers': len(files),
              'date_min': min(dates), 'date_max': max(dates),
              'runtime_commit': os.environ.get('RUNTIME_COMMIT'),
              'files': files, 'failures': failures,
          }
          assert meta['rows'] > 20_000 and meta['tickers'] >= 20, meta
          assert meta['date_min'] == '2013-02-08' and meta['date_max'] == '2018-02-07', meta
          (root / 'snapshot_metadata.json').write_text(json.dumps(meta, indent=2), encoding='utf-8')
          print(json.dumps({k:v for k,v in meta.items() if k != 'files'}, indent=2))
          PY

      - name: Run secure experiment bootstrap
        shell: bash
        run: |
          cat backtest_heist_runtime/bootstrap_parts/part* > /tmp/backtest_heist_bootstrap.sh
          chmod 700 /tmp/backtest_heist_bootstrap.sh
          /tmp/backtest_heist_bootstrap.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy data provenance
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/backtest-heist-data/snapshot_metadata.json ]; then
            mkdir -p backtest_heist_runtime/output
            cp /tmp/backtest-heist-data/snapshot_metadata.json backtest_heist_runtime/output/
          fi

      - name: Upload non-secret artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-heist-results-${{ github.run_id }}
          path: backtest_heist_runtime/output
          if-no-files-found: warn
          retention-days: 14
