name: Backtest Heist PR DeepSeek-V4-Flash pilot v2

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BACKTEST_HEIST_ISSUE_NUMBER: '14'
      BACKTEST_HEIST_RESULT_BRANCH: backtest-heist-results-20260804-v2
      FIXED_RUNTIME_COMMIT: '67063796b081c7899f9e9b869cbb707df709b4f2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import the immutable v2 runtime
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "$FIXED_RUNTIME_COMMIT"
          mkdir -p backtest_heist_runtime/runner_parts backtest_heist_runtime/bootstrap_parts
          git show "$FIXED_RUNTIME_COMMIT":backtest_heist_runtime/runner_parts/part00 > backtest_heist_runtime/runner_parts/part00
          git show "$FIXED_RUNTIME_COMMIT":backtest_heist_runtime/runner_parts/part01 > backtest_heist_runtime/runner_parts/part01
          git show "$FIXED_RUNTIME_COMMIT":backtest_heist_runtime/bootstrap_parts/part00 > backtest_heist_runtime/bootstrap_parts/part00

      - name: Reconstruct and run secure bootstrap
        shell: bash
        run: |
          cat backtest_heist_runtime/bootstrap_parts/part* > /tmp/backtest_heist_bootstrap.sh
          chmod 700 /tmp/backtest_heist_bootstrap.sh
          /tmp/backtest_heist_bootstrap.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload non-secret experiment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-heist-results-${{ github.run_id }}
          path: backtest_heist_runtime/output
          if-no-files-found: warn
          retention-days: 14
