name: Backtest Heist PR DeepSeek-V4-Flash pilot v4

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BACKTEST_HEIST_ISSUE_NUMBER: '16'
      BACKTEST_HEIST_RESULT_BRANCH: backtest-heist-results-20260804-v4
      BACKTEST_HEIST_REAL_DATA_PATH: '/tmp/backtest-heist-data/all_stocks_5yr.csv'
      PINNED_DATA_COMMIT: '03917ece161e269098fb0e84a9aac8956683bc7b'
      PINNED_DATA_REPOSITORY: 'saeed349/Deep-Reinforcement-Learning-in-Trading'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import the reviewed v4 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin backtest-heist-runtime-v4
          RUNTIME_COMMIT="$(git rev-parse FETCH_HEAD)"
          echo "RUNTIME_COMMIT=$RUNTIME_COMMIT" >> "$GITHUB_ENV"
          rm -rf backtest_heist_runtime
          mkdir -p backtest_heist_runtime/runner_parts backtest_heist_runtime/bootstrap_parts
          git show "$RUNTIME_COMMIT":backtest_heist_runtime/bootstrap_parts/part00 > backtest_heist_runtime/bootstrap_parts/part00
          for p in 00 01 02 03 04 05 06; do
            git show "$RUNTIME_COMMIT":backtest_heist_runtime/runner_parts/part${p} > backtest_heist_runtime/runner_parts/part${p}
          done

      - name: Assemble and validate commit-pinned S&P 500 panel
        shell: bash
        env:
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          DATA_DIR=/tmp/backtest-heist-data
          CSV="$DATA_DIR/all_stocks_5yr.csv"
          mkdir -p "$DATA_DIR"
          python - <<'PY'
          import base64, hashlib, json, os, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          import pandas as pd

          repo = os.environ['PINNED_DATA_REPOSITORY']
          commit = os.environ['PINNED_DATA_COMMIT']
          token = os.environ.get('API_TOKEN', '')
          tickers = [
              'AAPL','MSFT','AMZN','GOOGL','ORCL','ADBE','IBM','INTC','CSCO',
              'JPM','BAC','GS','MS','XOM','CVX','COP','SLB','CAT','BA','MMM',
              'JNJ','PFE','PG','KO','WMT','HD','VZ','T',
          ]
          out_dir = Path('/tmp/backtest-heist-data')
          frames = []
          files = {}
          failures = {}

          def fetch_one(ticker: str) -> bytes:
              path = f'Data/{ticker}_data.csv'
              quoted_path = urllib.parse.quote(path, safe='/')
              url = f'https://api.github.com/repos/{repo}/contents/{quoted_path}?ref={commit}'
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'backtest-heist-research-pilot/1.0',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              if token:
                  headers['Authorization'] = f'Bearer {token}'
              last = None
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=45) as resp:
                          payload = json.load(resp)
                      return base64.b64decode(payload['content'])
                  except Exception as exc:
                      last = exc
                      time.sleep(min(2 ** attempt, 16))
              raise RuntimeError(f'{type(last).__name__}: {last}')

          for ticker in tickers:
              try:
                  raw = fetch_one(ticker)
                  local = out_dir / f'{ticker}_data.csv'
                  local.write_bytes(raw)
                  df = pd.read_csv(local)
                  expected = {'date','open','high','low','close','volume','Name'}
                  if set(df.columns) != expected:
                      raise ValueError(f'columns={list(df.columns)}')
                  if len(df) < 1000 or str(df['Name'].iloc[0]).upper() != ticker:
                      raise ValueError(f'rows={len(df)}, first_name={df["Name"].iloc[0]}')
                  frames.append(df)
                  files[ticker] = {
                      'path': f'Data/{ticker}_data.csv',
                      'sha256': hashlib.sha256(raw).hexdigest(),
                      'rows': int(len(df)),
                      'date_min': str(df['date'].min()),
                      'date_max': str(df['date'].max()),
                  }
              except Exception as exc:
                  failures[ticker] = f'{type(exc).__name__}: {exc}'

          if len(frames) < 20:
              raise RuntimeError(f'Only {len(frames)} pinned symbols loaded; failures={failures}')
          panel = pd.concat(frames, ignore_index=True)
          panel = panel.sort_values(['Name','date']).reset_index(drop=True)
          panel.to_csv(out_dir / 'all_stocks_5yr.csv', index=False)
          combined_raw = (out_dir / 'all_stocks_5yr.csv').read_bytes()
          meta = {
              'source_repository': repo,
              'source_commit': commit,
              'upstream_dataset': 'camnugent/sandp500',
              'upstream_version': 4,
              'upstream_license': 'CC0-1.0',
              'combined_file': 'all_stocks_5yr.csv',
              'combined_sha256': hashlib.sha256(combined_raw).hexdigest(),
              'rows': int(len(panel)),
              'tickers': int(panel['Name'].nunique()),
              'date_min': str(panel['date'].min()),
              'date_max': str(panel['date'].max()),
              'runtime_commit': os.environ.get('RUNTIME_COMMIT'),
              'files': files,
              'failures': failures,
          }
          assert meta['rows'] > 20_000, meta
          assert meta['tickers'] >= 20, meta
          assert meta['date_min'] == '2013-02-08', meta
          assert meta['date_max'] == '2018-02-07', meta
          (out_dir / 'snapshot_metadata.json').write_text(json.dumps(meta, indent=2), encoding='utf-8')
          print(json.dumps({k: v for k, v in meta.items() if k != 'files'}, indent=2))
          PY

      - name: Reconstruct and run secure bootstrap
        shell: bash
        run: |
          cat backtest_heist_runtime/bootstrap_parts/part* > /tmp/backtest_heist_bootstrap.sh
          chmod 700 /tmp/backtest_heist_bootstrap.sh
          /tmp/backtest_heist_bootstrap.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy snapshot provenance into results
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/backtest-heist-data/snapshot_metadata.json ]; then
            mkdir -p backtest_heist_runtime/output
            cp /tmp/backtest-heist-data/snapshot_metadata.json backtest_heist_runtime/output/
          fi

      - name: Upload non-secret experiment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-heist-results-${{ github.run_id }}
          path: backtest_heist_runtime/output
          if-no-files-found: warn
          retention-days: 14
