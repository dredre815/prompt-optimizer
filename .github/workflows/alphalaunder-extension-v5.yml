name: AlphaLaunder Extension Experiments V5

on:
  push:
    paths:
      - .github/workflows/alphalaunder-extension-v5.yml
      - alphalaunder_extension_v5/**
  workflow_dispatch:

jobs:
  run-extension-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
    env:
      ALPHALAUNDER_ISSUE_NUMBER: "17"
      ALPHALAUNDER_RESULT_BRANCH: "alphalaunder-extension-v5-results-20260804"
      ALPHALAUNDER_WORKERS: "10"
      ALPHALAUNDER_VARIANTS: "16"
      ALPHALAUNDER_REPLICATES: "3"
      ALPHALAUNDER_TRIAL_SEEDS: "200"
      ALPHALAUNDER_ROLLBACK_RUNS: "100"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct verified bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cat alphalaunder_extension_v5/bootstrap_parts/part* > /tmp/alphalaunder-extension-v5.sh.gz.b64
          base64 --decode /tmp/alphalaunder-extension-v5.sh.gz.b64 | gzip --decompress > /tmp/alphalaunder-extension-v5.sh
          echo "9588fa981f9f62ff89ef743c65f7c2e8d094058ea02d45d29147f27bc915a61a  /tmp/alphalaunder-extension-v5.sh" | sha256sum --check --strict
          bash -n /tmp/alphalaunder-extension-v5.sh

      - name: Run credential-isolated extension suite
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash /tmp/alphalaunder-extension-v5.sh

      - name: Upload extension artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphalaunder-extension-v5
          path: alphalaunder_extension_v5_artifact
          if-no-files-found: warn
          retention-days: 7
