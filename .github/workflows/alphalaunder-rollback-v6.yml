name: AlphaLaunder Native Selective Rollback V6

on:
  push:
    paths:
      - .github/workflows/alphalaunder-rollback-v6.yml
      - alphalaunder_rollback_v6/**
  workflow_dispatch:

jobs:
  run-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run native trajectory rollback experiment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pandas
          git clone --quiet https://github.com/QuantaAlpha/QuantaAlpha.git /tmp/QuantaAlpha
          git -C /tmp/QuantaAlpha checkout --quiet b7ceb27b1001261d7a95b209a963664ae1f8ab23
          base64 --decode alphalaunder_rollback_v6/rollback_native_v2.py.gz.b64 | gzip --decompress > /tmp/rollback_native.py
          echo "96fbf34c07675e21b30e22ce20010342c5b951d2d28156b2f12a6873cf762d92  /tmp/rollback_native.py" | sha256sum --check --strict
          python -m py_compile /tmp/rollback_native.py
          mkdir -p alphalaunder_rollback_v6_results
          python /tmp/rollback_native.py \
            --quanta-root /tmp/QuantaAlpha \
            --out-dir alphalaunder_rollback_v6_results \
            --runs 100 \
            | tee alphalaunder_rollback_v6_results/execution.log
          (cd alphalaunder_rollback_v6_results && sha256sum * > SHA256SUMS.txt)

      - name: Publish rollback results branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/publish
          git -C /tmp/publish config user.name "alphalaunder-experiment-bot"
          git -C /tmp/publish config user.email "alphalaunder-experiment-bot@users.noreply.github.com"
          git -C /tmp/publish checkout --orphan alphalaunder-rollback-v6-results-20260804
          git -C /tmp/publish rm -rf . >/dev/null 2>&1 || true
          cp -a alphalaunder_rollback_v6_results /tmp/publish/results
          git -C /tmp/publish add results
          git -C /tmp/publish commit -m "paper1: publish native selective rollback results" >/dev/null
          git -C /tmp/publish push --force origin HEAD:alphalaunder-rollback-v6-results-20260804 >/dev/null

      - name: Upload rollback artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphalaunder-rollback-v6
          path: alphalaunder_rollback_v6_results
          if-no-files-found: warn
          retention-days: 7
