name: AlphaLaunder DeepSeek-V4-Flash Experiment

on:
  push:
    paths:
      - .github/workflows/alphalaunder-deepseek.yml
      - alphalaunder_runtime/**
  workflow_dispatch:

jobs:
  run-alphalaunder:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      issues: write
    env:
      ALPHALAUNDER_ISSUE_NUMBER: "12"
      ALPHALAUNDER_RESULT_BRANCH: "alphalaunder-deepseek-v4-results-20260803"
      ALPHALAUNDER_WORKERS: "4"
      ALPHALAUNDER_REPLICATES: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct verified bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cat alphalaunder_runtime/bootstrap_parts/part* > /tmp/alphalaunder-bootstrap.sh
          echo "c08274f569349e26601d39ddba9bbbaa6d150e474343c0c3129b4c8ee522d2c0  /tmp/alphalaunder-bootstrap.sh" | sha256sum --check --strict
          bash -n /tmp/alphalaunder-bootstrap.sh

      - name: Run credential-isolated AlphaLaunder experiment
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash /tmp/alphalaunder-bootstrap.sh
