name: WorldSeal full verified experiments
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  target:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: [tradingagents, broker, rdagent]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      WORLDSEAL_ISSUE_NUMBER: '24'
      WORLDSEAL_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct, patch, and verify full-run sources
        shell: bash
        run: |
          echo "14b48e7315f6dbebb1ba5ff72a508bc9f9c90744f445ae910bf1889243e332f8  worldseal_clean/pilot_chunks/part00" | sha256sum --check --strict
          echo "937789eef24cfe6011d2a9341ee3119126dc609d8766ac3ff4c5a927c495762a  worldseal_clean/pilot_chunks/part01" | sha256sum --check --strict
          echo "55fbc718a1f44413cbe8ff226bb90221032c2d25b5b06f17cb1ebf256a839298  worldseal_clean/pilot_chunks/part02" | sha256sum --check --strict
          echo "a115b35960a5c68b6fa8de8690fe5583b2945e162b401677bb2ebf9c87747023  worldseal_clean/pilot_chunks/part03" | sha256sum --check --strict
          echo "8e0953de02ea370c178836beff7d5ef4e856019656275a949e9fab706b6c8860  worldseal_clean/pilot_chunks/part04" | sha256sum --check --strict
          echo "e641b3dd48ac3580ad0bf53a0cbd3c70102071cf6ef986e638c9509c3f8136c5  worldseal_clean/pilot_chunks/part05" | sha256sum --check --strict
          echo "ec49e6dcafea22ca50ee9039f1ccb7682c3ebe8c0c93c90785efd0c16519c167  worldseal_clean/pilot_chunks/part06" | sha256sum --check --strict
          echo "9dac02ab2a1fbd4690b6fec8f7878ae1b18e7f6adfe61d69f1f42890a390ba46  worldseal_clean/pilot_chunks/part07" | sha256sum --check --strict
          echo "fee3392652bcf3f7eb176c72fbe5290c477d6f3e80f0aa14204715eea635ca7a  worldseal_clean/pilot_chunks/part08" | sha256sum --check --strict
          cat worldseal_clean/pilot_chunks/part* > /tmp/worldseal_payload.b64
          echo "52914ed76e2b0df9286a551ce3cb1d60200b49749f3cca6f8d17f894aab47d07  /tmp/worldseal_payload.b64" | sha256sum --check --strict
          base64 --decode /tmp/worldseal_payload.b64 > /tmp/worldseal_payload.tar.gz
          echo "36b5c2417c312e747f70b1e7017c539b632ae7b0a10713c4351aab903ab713e5  /tmp/worldseal_payload.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/worldseal_payload.tar.gz
          python worldseal_clean/apply_v2_patch.py
          echo "169a77489dc0e24c9c5723cd3be0b74605040af2f0923d96d28c0afb4862ac29  worldseal_clean/common.py" | sha256sum --check --strict
          echo "00f80c903f3b7cc2148d9ba49af45adbab0c6cc7bae37824944cd7186505305d  worldseal_clean/tradingagents_experiment.py" | sha256sum --check --strict
          echo "83d05083c8342c2df0ff3b2a15af2be89d1cb422db8051377111c267f2146355  worldseal_clean/rdagent_experiment.py" | sha256sum --check --strict
          chmod +x worldseal_clean/smoke.sh worldseal_clean/run_target.sh worldseal_clean/credential_bootstrap_target.sh
          python -m py_compile worldseal_clean/common.py worldseal_clean/tradingagents_experiment.py worldseal_clean/broker_experiment.py worldseal_clean/rdagent_experiment.py worldseal_clean/verify_target.py
      - name: Credential-isolated full target run
        shell: bash
        run: bash worldseal_clean/credential_bootstrap_target.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require hard-verification marker
        if: success()
        run: test -f "worldseal_output/FULL_COMPLETE_SUCCESS_${WORLDSEAL_TARGET}.marker"
      - name: Package target evidence
        if: always()
        shell: bash
        run: |
          if [ -d worldseal_output ]; then
            zip -q -r "worldseal_full_${WORLDSEAL_TARGET}_evidence.zip" worldseal_output
          fi
      - name: Upload target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldseal-full-${{ matrix.target }}-${{ github.run_id }}
          path: |
            worldseal_output
            worldseal_full_${{ matrix.target }}_evidence.zip
          if-no-files-found: warn
          retention-days: 14
