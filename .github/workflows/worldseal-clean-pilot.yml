name: WorldSeal verified pilot experiments
on:
  push:
    branches: [worldseal-clean-rerun-20260810]
    paths:
      - '.github/workflows/worldseal-clean-pilot.yml'
      - 'worldseal_clean/pilot_chunks/**'
      - 'worldseal_clean/apply_v2_patch.py'
      - 'worldseal_clean/apply_v3_patch.py'
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WORLDSEAL_ISSUE_NUMBER: '24'
      WORLDSEAL_RUN_MODE: 'pilot'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct, patch, and verify pilot sources
        shell: bash
        run: |
          echo "14b48e7315f6dbebb1ba5ff72a508bc9f9c90744f445ae910bf1889243e332f8  worldseal_clean/pilot_chunks/part00" | sha256sum --check --strict
          echo "937789eef24cfe6011d2a9341ee3119126dc609d8766ac3ff4c5a927c495762a  worldseal_clean/pilot_chunks/part01" | sha256sum --check --strict
          echo "55fbc718a1f44413cbe8ff226bb90221032c2d25b5b06f17cb1ebf256a839298  worldseal_clean/pilot_chunks/part02" | sha256sum --check --strict
          echo "a115b35960a5c68b6fa8de8690fe5583b2945e162b401677bb2ebf9c87747023  worldseal_clean/pilot_chunks/part03" | sha256sum --check --strict
          echo "8e0953de02ea370c178836beff7d5ef4e856019656275a949e9fab706b6c8860  worldseal_clean/pilot_chunks/part04" | sha256sum --check --strict
          echo "e641b3dd48ac3580ad0bf53a0cbd3c70102071cf6ef986e638c9509c3f8136c5  worldseal_clean/pilot_chunks/part05" | sha256sum --check --strict
          echo "ec49e6dcafea22ca50ee9039f1ccb7682c3ebe8c0c93c90785efd0c16519c167  worldseal_clean/pilot_chunks/part06" | sha256sum --check --strict
          echo "9dac02ab2a1fbd4690b6fec8f7878ae1b18e7f6adfe61d69f1f42890a390ba46  worldseal_clean/pilot_chunks/part07" | sha256sum --check --strict
          echo "fee3392652bcf3f7eb176c72fbe5290c477d6f3e80f0aa14204715eea635ca7a  worldseal_clean/pilot_chunks/part08" | sha256sum --check --strict
          cat worldseal_clean/pilot_chunks/part* > /tmp/worldseal_pilot_payload.tar.gz.b64
          echo "52914ed76e2b0df9286a551ce3cb1d60200b49749f3cca6f8d17f894aab47d07  /tmp/worldseal_pilot_payload.tar.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/worldseal_pilot_payload.tar.gz.b64 > /tmp/worldseal_pilot_payload.tar.gz
          echo "36b5c2417c312e747f70b1e7017c539b632ae7b0a10713c4351aab903ab713e5  /tmp/worldseal_pilot_payload.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/worldseal_pilot_payload.tar.gz
          python worldseal_clean/apply_v2_patch.py
          python worldseal_clean/apply_v3_patch.py
          echo "169a77489dc0e24c9c5723cd3be0b74605040af2f0923d96d28c0afb4862ac29  worldseal_clean/common.py" | sha256sum --check --strict
          echo "7e343e7616bb28363f4b34907c7b21a8f95f6ebc13fa5c29a559ba984b57c287  worldseal_clean/tradingagents_experiment.py" | sha256sum --check --strict
          echo "560e2f8a1e9ccadd6fb58c26dc106454a627b7194a1b872393461811df23e373  worldseal_clean/broker_experiment.py" | sha256sum --check --strict
          echo "4dc19941e49e9ba232a55c5360c33da950b1fb48278a7cabbd243e94aafced23  worldseal_clean/rdagent_experiment.py" | sha256sum --check --strict
          chmod +x worldseal_clean/run_all.sh worldseal_clean/credential_bootstrap.sh worldseal_clean/smoke.sh
          python -m py_compile worldseal_clean/common.py worldseal_clean/tradingagents_experiment.py worldseal_clean/broker_experiment.py worldseal_clean/rdagent_experiment.py worldseal_clean/verify_pilot.py
      - name: Credential-isolated verified pilots
        shell: bash
        run: bash worldseal_clean/credential_bootstrap.sh full
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify completion marker before upload
        if: success()
        run: test -f worldseal_output/PILOT_COMPLETE_SUCCESS.marker
      - name: Package pilot evidence
        if: always()
        shell: bash
        run: |
          if [ -d worldseal_output ]; then
            zip -q -r worldseal_pilot_evidence.zip worldseal_output
          fi
      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldseal-verified-pilot-${{ github.run_id }}
          path: |
            worldseal_output
            worldseal_pilot_evidence.zip
          if-no-files-found: warn
          retention-days: 14
