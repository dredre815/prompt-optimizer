name: AlphaLaunder Extract Paper-Complete Sources

on:
  push:
    paths:
      - .github/workflows/alphalaunder-extract-source.yml
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/alphalaunder-src
          mkdir -p /tmp/alphalaunder-src extracted_paper_complete_sources
          python - <<'PY'
          import base64, pathlib
          p = pathlib.Path('alphalaunder_paper_complete/source_bundle.tar.gz.b64')
          raw = ''.join(p.read_text().split())
          pathlib.Path('/tmp/source.tar.gz').write_bytes(base64.b64decode(raw, validate=False))
          PY
          echo "7926573f19034340fff931c0b8b6533ee1e2a3e7badb23ed4e2c4929dd4a55a5  /tmp/source.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/source.tar.gz -C /tmp/alphalaunder-src
          cp -a /tmp/alphalaunder-src/. extracted_paper_complete_sources/
          find extracted_paper_complete_sources -type f -maxdepth 3 -print
      - name: Commit extracted sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extracted_paper_complete_sources
          git commit -m "paper1: extract paper-complete experiment sources" || exit 0
          git push
