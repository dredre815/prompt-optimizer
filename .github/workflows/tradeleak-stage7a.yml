name: TradeLeak Stage7a Isolated Memory Leakage
on:
  pull_request:
    branches: [main]
    paths: ['tradeleak_stage7a_trigger/**']
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TRADELEAK_STAGE7A_ISSUE_NUMBER: '57'
      ATA_COMMIT: '6b49ee837ebc1fa0d5bf99d655dc3adc352a77d3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run frozen isolated memory experiment
        shell: bash
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          chmod +x tradeleak_stage7a/bootstrap.sh
          bash tradeleak_stage7a/bootstrap.sh
      - name: Upload non-secret results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradeleak-stage7a-results-${{ github.run_id }}
          path: tradeleak_stage7a_output
          if-no-files-found: warn
          retention-days: 14
