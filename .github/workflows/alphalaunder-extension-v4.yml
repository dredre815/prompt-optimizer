name: AlphaLaunder Extension Experiments V4

on:
  push:
    paths:
      - .github/workflows/alphalaunder-extension-v4.yml
      - alphalaunder_extension_v4/**
  workflow_dispatch:

jobs:
  run-extension-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
    env:
      ALPHALAUNDER_ISSUE_NUMBER: "17"
      ALPHALAUNDER_RESULT_BRANCH: "alphalaunder-extension-v4-results-20260804"
      ALPHALAUNDER_WORKERS: "10"
      ALPHALAUNDER_VARIANTS: "16"
      ALPHALAUNDER_REPLICATES: "3"
      ALPHALAUNDER_TRIAL_SEEDS: "200"
      ALPHALAUNDER_ROLLBACK_RUNS: "100"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct verified bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cat alphalaunder_extension_v4/bootstrap_parts/part* > /tmp/alphalaunder-extension-bootstrap.sh.gz.b64
          base64 --decode /tmp/alphalaunder-extension-bootstrap.sh.gz.b64 | gzip --decompress > /tmp/alphalaunder-extension-bootstrap.sh
          echo "1949006b3c47844bd8aba02c10328039713bc55f8d92cedaca141a6bb7e5029e  /tmp/alphalaunder-extension-bootstrap.sh" | sha256sum --check --strict
          bash -n /tmp/alphalaunder-extension-bootstrap.sh

      - name: Run credential-isolated extension experiments
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash /tmp/alphalaunder-extension-bootstrap.sh

      - name: Upload experiment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alphalaunder-extension-v4
          path: alphalaunder_extension_artifact
          if-no-files-found: warn
          retention-days: 7
