name: PATHFINDER TOFU20 strict matched-probe pilot v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pathfinder-probe-pilot.yml'

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PATHFINDER_ISSUE_NUMBER: '73'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned pilot dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'google-genai>=2.0,<3' 'pydantic>=2.8,<3' 'requests>=2.32,<3'

      - name: Validate v6 payload and secure runner
        shell: bash
        run: |
          bash -n pathfinder_probe_pilot/gemini_credential.sh
          tr -d '[:space:]' < pathfinder_probe_pilot/run_tofu_v6.py.gz.b64 | base64 --decode | gzip -dc > /tmp/run_tofu_v6.py
          echo 'b0b7352ff08efe80165d67979e931c4911a8b3cc20bb2ae10bbd067ef45af9b8  /tmp/run_tofu_v6.py' | sha256sum --check --strict
          python -m py_compile /tmp/run_tofu_v6.py
          rm -f /tmp/run_tofu_v6.py
          sha256sum pathfinder_probe_pilot/gemini_credential.sh

      - name: Run secure Gemini-backed TOFU20 v6 pilot
        shell: bash
        run: bash pathfinder_probe_pilot/gemini_credential.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pathfinder-tofu20-v6-${{ github.run_id }}
          path: pathfinder_probe_pilot/output
          if-no-files-found: warn
          retention-days: 14
