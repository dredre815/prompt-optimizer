name: PATHFINDER strict matched-probe pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pathfinder-probe-pilot.yml'

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PATHFINDER_ISSUE_NUMBER: '73'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned pilot dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'google-genai>=2.0,<3' 'pydantic>=2.8,<3' 'requests>=2.32,<3'

      - name: Validate pilot source
        shell: bash
        run: |
          python -m py_compile pathfinder_probe_pilot/run_pilot.py
          bash -n pathfinder_probe_pilot/gemini_credential.sh
          sha256sum pathfinder_probe_pilot/run_pilot.py pathfinder_probe_pilot/gemini_credential.sh

      - name: Run secure Gemini-backed RWKU pilot
        shell: bash
        run: bash pathfinder_probe_pilot/gemini_credential.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pathfinder-strict-matched-probe-pilot-${{ github.run_id }}
          path: pathfinder_probe_pilot/output
          if-no-files-found: warn
          retention-days: 14
