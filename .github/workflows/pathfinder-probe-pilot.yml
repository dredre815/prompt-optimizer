name: PATHFINDER strict matched-probe dual pilot v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pathfinder-probe-pilot.yml'

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PATHFINDER_ISSUE_NUMBER: '73'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned pilot dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'google-genai>=2.0,<3' 'requests>=2.32,<3'

      - name: Validate v5 pilot payload and secure runner
        shell: bash
        run: |
          bash -n pathfinder_probe_pilot/gemini_credential.sh
          test "$(sha256sum pathfinder_probe_pilot/run_dual_pilot.py.gz.b64 | awk '{print $1}')" = '1ae8557295696d7a542269d14739a7f1e4f2ca7b009eac9eca0b330c14e14d41'
          sha256sum pathfinder_probe_pilot/gemini_credential.sh

      - name: Run secure Gemini-backed TOFU20 + RWKU20 v5 pilot
        shell: bash
        run: bash pathfinder_probe_pilot/gemini_credential.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pathfinder-strict-matched-probe-dual-v5-${{ github.run_id }}
          path: pathfinder_probe_pilot/output
          if-no-files-found: warn
          retention-days: 14
