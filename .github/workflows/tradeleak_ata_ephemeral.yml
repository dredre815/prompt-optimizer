        raw=p.read_bytes(); new=raw.replace(secret,b'[REDACTED]') if secret else raw; new=pat.sub(b'[REDACTED_KEY_PATTERN]',new)
        if new!=raw: p.write_bytes(new)
if secret:
    hits=[str(p) for p in root.rglob('*') if p.is_file() and secret in p.read_bytes()]
    if hits: raise SystemExit('credential remnants: '+','.join(hits))
PY
          unset DEEPSEEK_API_KEY OPENAI_API_KEY

          if [ -f "$RESULTS/summary.json" ]; then
            python - "$RESULTS/summary.json" "$ROOT/result_comment.txt" "$GITHUB_RUN_ID" "$rc" <<'PY'
import json,sys
s=json.load(open(sys.argv[1])); m=s['metrics']
lines=[
 'TRADELEAK_ATA_RESULT_V1',
 f'run_id={sys.argv[3]}',f'exit_code={sys.argv[4]}',f'verdict={s["verdict"]}',f'model={s["model"]}',f'ata_commit={s["ata_commit"]}',
 f'active_accuracy={m["active_accuracy"]:.4f}',f'passive_accuracy={m["passive_accuracy"]:.4f}',f'random_accuracy={m["random_accuracy"]:.4f}',
 f'active_gain_over_passive={m["active_gain_over_passive"]:.4f}',f'active_gain_over_random={m["active_gain_over_random"]:.4f}',
 f'valid_response_rate={m["valid_response_rate"]:.4f}',f'median_active_price_impact_pct={m["median_active_price_impact_pct"]:.4f}',
 f'median_active_probe_cost={m["median_active_probe_cost"]:.2f}',f'selected_active_probes={json.dumps(s["selected_active_probes"],sort_keys=True)}',
 'go_rule='+s['go_rule'],
 'Artifact contains calibration/test JSONL and full non-secret execution log.'
]
open(sys.argv[2],'w').write('\n'.join(lines)+'\n')
PY
          else
            { echo 'TRADELEAK_ATA_RESULT_V1'; echo "run_id=$GITHUB_RUN_ID"; echo "exit_code=$rc"; echo 'verdict=INCONCLUSIVE-INFRA'; echo 'summary_missing=true'; tail -n 40 "$RESULTS/run.log"; } > "$ROOT/result_comment.txt"
          fi
          comment_file "$ROOT/result_comment.txt" || true
          exit "$rc"

      - name: Upload non-secret results
        if: always()
        uses: actions/upload-artifact@v4
        with:
