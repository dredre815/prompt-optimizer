name: TradeLeak Stage4 Native ATA
on:
  pull_request:
    branches: [main]
    paths:
      - 'tradeleak_stage4_trigger/**'
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TRADELEAK_STAGE4_ISSUE_NUMBER: '41'
      ATA_COMMIT: '6b49ee837ebc1fa0d5bf99d655dc3adc352a77d3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run native ATA cognition validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x tradeleak_stage4/bootstrap.sh
          bash tradeleak_stage4/bootstrap.sh
      - name: Upload non-secret results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradeleak-stage4-results-${{ github.run_id }}
          path: tradeleak_stage4_output
          if-no-files-found: warn
          retention-days: 14
