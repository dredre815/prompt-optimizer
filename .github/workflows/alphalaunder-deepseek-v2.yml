name: AlphaLaunder DeepSeek-V4-Flash Experiment V2

on:
  push:
    paths:
      - .github/workflows/alphalaunder-deepseek-v2.yml
      - alphalaunder_runtime_v2/**
  workflow_dispatch:

jobs:
  run-alphalaunder-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      issues: write
    env:
      ALPHALAUNDER_ISSUE_NUMBER: "12"
      ALPHALAUNDER_RESULT_BRANCH: "alphalaunder-deepseek-v4-results-v2-20260803"
      ALPHALAUNDER_WORKERS: "4"
      ALPHALAUNDER_REPLICATES: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct verified bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cat alphalaunder_runtime_v2/bootstrap_parts/part* > /tmp/alphalaunder-bootstrap-v2.sh
          echo "057e8868ac1889396f01c1d522e870405cfcc5c8ca589912595f0fa0bfc03ba9  /tmp/alphalaunder-bootstrap-v2.sh" | sha256sum --check --strict
          bash -n /tmp/alphalaunder-bootstrap-v2.sh

      - name: Run credential-isolated AlphaLaunder V2 experiment
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash /tmp/alphalaunder-bootstrap-v2.sh
